<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Review Card Gateway</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <!-- TAMPILAN LOADING / CEK STATUS KARTU -->
    <div id="loadingView" class="text-center">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mx-auto mb-4"></div>
        <h2 id="loadingText" class="text-lg font-semibold text-slate-700">Memeriksa status kartu...</h2>
        <p id="errorText" class="text-sm text-rose-500 mt-2"></p>
    </div>

    <!-- HALAMAN FORM AKTIVASI -->
    <div id="adminView" class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 border border-slate-100 hidden">
        <div class="text-center mb-6">
            <span class="inline-block bg-amber-100 text-amber-800 text-xs font-semibold px-2.5 py-0.5 rounded-full mb-2">Kartu Belum Diaktivasi</span>
            <h1 class="text-2xl font-bold text-slate-800">Aktivasi Kartu Review</h1>
            <p class="text-sm text-slate-500 mt-1">Daftarkan Place ID Google Maps ke Kartu Fisik Ini</p>
        </div>

        <form id="activationForm" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">ID Fisik Kartu</label>
                <input type="text" id="cardId" required readonly
                    class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-100 text-slate-500 focus:outline-none text-sm cursor-not-allowed">
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Nama Bisnis</label>
                <input type="text" id="businessName" required placeholder="Contoh: Kopi Senang" 
                    class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Google Maps Place ID</label>
                <input type="text" id="placeId" required placeholder="Contoh: ChIJN1t_tDeuEms..." 
                    class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
            </div>

            <button type="submit" id="saveBtn"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition duration-200 text-sm shadow-md shadow-blue-200">
                Simpan & Aktifkan Kartu
            </button>
        </form>

        <div id="responseMessage" class="mt-4 text-center text-sm font-medium hidden"></div>
    </div>

    <!-- LOGIKA JAVASCRIPT & KODE FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCiLuG_nM1ASeLdLggEfjSjCAREhl-tTV8",
            authDomain: "riview-card.firebaseapp.com",
            databaseURL: "https://riview-card-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "riview-card",
            storageBucket: "riview-card.firebasestorage.app",
            messagingSenderId: "75278422286",
            appId: "1:75278422286:web:fc47020c9325ffe745c75f",
            measurementId: "G-S7PN1NFZDJ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const cardParam = urlParams.get('card');

        const loadingView = document.getElementById('loadingView');
        const adminView = document.getElementById('adminView');
        const cardIdInput = document.getElementById('cardId');

        if (cardParam) {
            cardIdInput.value = cardParam;
            checkCardStatus(cardParam);
        } else {
            loadingView.classList.add('hidden');
            adminView.classList.remove('hidden');
            cardIdInput.removeAttribute('readonly');
            cardIdInput.classList.remove('bg-slate-100', 'text-slate-500', 'cursor-not-allowed');
        }

        async function checkCardStatus(id) {
            try {
                console.log("Mengecek status kartu:", id);
                const docRef = doc(db, "cards", id);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const data = docSnap.data();
                    console.log("Data ditemukan di Firebase:", data);

                    // Pastikan field placeId ada dan tidak kosong
                    if (data && data.placeId && data.placeId.trim() !== "") {
                        document.getElementById('loadingText').textContent = "Mengarahkan ke Ulasan Google Maps...";
                        window.location.replace(`https://search.google.com/local/writereview?placeid=${data.placeId.trim()}`);
                    } else {
                        console.log("Data kartu ada, tapi placeId kosong/belum diisi.");
                        loadingView.classList.add('hidden');
                        adminView.classList.remove('hidden');
                    }
                } else {
                    console.log("Kartu belum terdaftar sama sekali di database.");
                    loadingView.classList.add('hidden');
                    adminView.classList.remove('hidden');
                }
            } catch (err) {
                console.error("Terjadi error saat membaca database:", err);
                loadingView.classList.add('hidden');
                adminView.classList.remove('hidden');
            }
        }

        const form = document.getElementById('activationForm');
        const messageDiv = document.getElementById('responseMessage');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const cId = cardIdInput.value.trim();
            const businessName = document.getElementById('businessName').value.trim();
            const placeId = document.getElementById('placeId').value.trim();
            const saveBtn = document.getElementById('saveBtn');

            saveBtn.textContent = "Menyimpan & Mengaktifkan...";
            saveBtn.disabled = true;
            messageDiv.classList.add('hidden');

            try {
                await setDoc(doc(db, "cards", cId), {
                    businessName,
                    placeId,
                    updatedAt: new Date().toISOString()
                });

                messageDiv.classList.remove('hidden');
                messageDiv.className = "mt-4 text-center text-sm font-medium text-emerald-600";
                messageDiv.textContent = `Sukses! Kartu aktif. Membuka Google Maps...`;
                
                setTimeout(() => {
                    window.location.replace(`https://search.google.com/local/writereview?placeid=${placeId}`);
                }, 1500);

            } catch (err) {
                messageDiv.classList.remove('hidden');
                messageDiv.className = "mt-4 text-center text-sm font-medium text-rose-600";
                messageDiv.textContent = "Gagal: " + err.message;
                saveBtn.textContent = "Simpan & Aktifkan Kartu";
                saveBtn.disabled = false;
                console.error(err);
            }
        });
    </script>
</body>
</html>
